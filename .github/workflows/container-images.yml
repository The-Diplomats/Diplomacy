name: Container Images

on:
  pull_request:
    branches: [main]
  merge_group:
  # deploy-dev.yml calls this for pushes to main; release.yml calls it with `ref` when the
  # release commit has no sha- image yet.
  workflow_call:
    inputs:
      ref:
        description: Commit to build; defaults to the triggering commit
        type: string
        default: ""
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        app: [backend, worker]
    env:
      # PRs only build, to catch Dockerfile breakage before merge. Only main publishes,
      # so a manual run on another branch can't overwrite a deployable tag.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: source
        env:
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
        run: echo "short=${SOURCE_SHA::7}" >> "$GITHUB_OUTPUT"

      # PRs and the merge queue always run so the required check reports; gate real work by
      # path changes. Calls from deploy-dev and manual runs skip the filter, so its empty output lets them build.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          filters: |
            images:
              - 'ProjectSourceCode/apps/backend/**'
              - 'ProjectSourceCode/apps/worker/**'
              - 'ProjectSourceCode/packages/**'
              - 'ProjectSourceCode/package.json'
              - 'ProjectSourceCode/pnpm-lock.yaml'
              - 'ProjectSourceCode/pnpm-workspace.yaml'
              - 'ProjectSourceCode/tsconfig*.json'
              - 'ProjectSourceCode/.dockerignore'
              - '.github/workflows/container-images.yml'

      - if: steps.filter.outputs.images == 'false'
        run: echo "No image changes; skipping build."

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.filter.outputs.images != 'false'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name (GHCR rejects the org's capitals)
      # and adds the source label that links the package to this repo.
      - id: meta
        if: steps.filter.outputs.images != 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/diplomacy-${{ matrix.app }}
          tags: |
            type=raw,value=sha-${{ steps.source.outputs.short }}
            type=ref,event=branch,enable=${{ inputs.ref == '' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.filter.outputs.images != 'false'
        with:
          context: ProjectSourceCode
          file: ProjectSourceCode/apps/${{ matrix.app }}/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
