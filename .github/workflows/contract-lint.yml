name: Contract Lint

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: OpenAPI spec lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProjectSourceCode
    steps:
      - uses: actions/checkout@v4

      # Always run so the required check reports; gate real work by path changes.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'ProjectSourceCode/packages/contracts/**'
              - 'ProjectSourceCode/pnpm-workspace.yaml'
              - 'ProjectSourceCode/pnpm-lock.yaml'
              - '.github/workflows/contract-lint.yml'

      - if: steps.filter.outputs.contracts != 'true'
        run: echo "No contract changes; skipping lint."

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.contracts == 'true'
        with:
          package_json_file: ProjectSourceCode/package.json
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.contracts == 'true'
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: ProjectSourceCode/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter '@diplomacy/contracts...'
        if: steps.filter.outputs.contracts == 'true'
      - name: Lint OpenAPI spec
        if: steps.filter.outputs.contracts == 'true'
        run: pnpm --filter @diplomacy/contracts exec redocly lint api/public/openapi.yaml
