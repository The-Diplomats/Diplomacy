name: Deploy Frontend (dev)

on:
  push:
    branches: [main]
    paths:
      - "ProjectSourceCode/apps/frontend/**"
      - "ProjectSourceCode/packages/**"
      - "ProjectSourceCode/package.json"
      - "ProjectSourceCode/pnpm-lock.yaml"
      - "ProjectSourceCode/pnpm-workspace.yaml"
      - "ProjectSourceCode/tsconfig*.json"
      - ".github/workflows/deploy-frontend-dev.yml"
  workflow_dispatch:

# Queue deploys instead of cancelling one mid-upload.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: dev
      url: https://app.dev.diplomacy.gg
    defaults:
      run:
        working-directory: ProjectSourceCode
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ProjectSourceCode/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: ProjectSourceCode/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "frontend..." build
        env:
          VITE_API_URL: https://api.dev.diplomacy.gg

      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ProjectSourceCode/apps/frontend/dist
          skip_app_build: true
          skip_api_build: true
