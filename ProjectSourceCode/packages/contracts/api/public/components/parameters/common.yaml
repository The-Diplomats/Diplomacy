GameId:
  name: gameId
  in: path
  required: true
  description: Game ID
  schema:
    type: string
    format: uuid

ParticipantId:
  name: participantId
  in: path
  required: true
  description: Player ID of the other participant in the DM thread
  schema:
    type: string
    format: uuid

Limit:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 50

Cursor:
  name: cursor
  in: query
  required: false
  schema:
    type: string
