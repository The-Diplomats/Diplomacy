SendMessageRequest:
  type: object
  required: [text]
  additionalProperties: false
  properties:
    text:
      type: string
      minLength: 1
      maxLength: 2000

Message:
  type: object
  required: [id, gameId, fromPlayerId, fromUsername, fromPower, toPlayerId, text, createdAt]
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    gameId:
      type: string
      format: uuid
    fromPlayerId:
      type: string
      format: uuid
    fromUsername:
      type: [string, 'null']
      description: Null for AI players
    fromPower:
      type: [string, 'null']
      enum: [austria, england, france, germany, italy, russia, turkey, null]
      description: Null when the game is still forming
    toPlayerId:
      type: [string, 'null']
      format: uuid
      description: Null means public message
    text:
      type: string
    createdAt:
      type: string
      format: date-time

MessageList:
  type: object
  required: [messages]
  additionalProperties: false
  properties:
    messages:
      type: array
      items:
        $ref: '#/Message'
