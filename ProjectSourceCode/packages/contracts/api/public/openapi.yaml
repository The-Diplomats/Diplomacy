openapi: 3.1.0
info:
  title: Diplomacy API
  version: 0.0.0
  description: |
    Internal API contract for the Diplomacy monorepo. New game-related payloads are proposed for team
    review.

    During a maintenance window every operation except `/health` returns `503` with a `Retry-After`
    header and a `ProblemDetails` body, so individual operations don't list it.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: /
    description: Mount-relative base path
tags:
  - name: Health
    description: Service health
  - name: Auth
    description: Authentication
  - name: Games
    description: Game creation and management
  - name: Phases
    description: Phase status and resolution
  - name: Orders
    description: Order submission and retrieval
  - name: Ready
    description: Player readiness and grace handling
  - name: Messages
    description: Game chat
paths:
  /health:
    $ref: './paths/health.yaml#/paths/~1health'

  /auth/me:
    $ref: './paths/auth.yaml#/paths/~1auth~1me'
  /auth/login:
    $ref: './paths/auth.yaml#/paths/~1auth~1login'
  /auth/register:
    $ref: './paths/auth.yaml#/paths/~1auth~1register'
  /auth/register/verify:
    $ref: './paths/auth.yaml#/paths/~1auth~1register~1verify'
  /auth/register/resend:
    $ref: './paths/auth.yaml#/paths/~1auth~1register~1resend'
  /auth/password-reset:
    $ref: './paths/auth.yaml#/paths/~1auth~1password-reset'
  /auth/password-reset/verify:
    $ref: './paths/auth.yaml#/paths/~1auth~1password-reset~1verify'
  /auth/logout:
    $ref: './paths/auth.yaml#/paths/~1auth~1logout'
  /auth/oauth/microsoft/login:
    $ref: './paths/auth.yaml#/paths/~1auth~1oauth~1microsoft~1login'
  /auth/oauth/microsoft/callback:
    $ref: './paths/auth.yaml#/paths/~1auth~1oauth~1microsoft~1callback'
  /auth/oauth/google/login:
    $ref: './paths/auth.yaml#/paths/~1auth~1oauth~1google~1login'
  /auth/oauth/google/callback:
    $ref: './paths/auth.yaml#/paths/~1auth~1oauth~1google~1callback'
  /auth/oauth/providers:
    $ref: './paths/auth.yaml#/paths/~1auth~1oauth~1providers'
  /auth/oauth/pending:
    $ref: './paths/auth.yaml#/paths/~1auth~1oauth~1pending'
  /auth/oauth/complete:
    $ref: './paths/auth.yaml#/paths/~1auth~1oauth~1complete'

  /games:
    $ref: './paths/games.yaml#/paths/~1games'
  /games/{gameId}:
    $ref: './paths/games.yaml#/paths/~1games~1{gameId}'
  /games/{gameId}/join:
    $ref: './paths/games.yaml#/paths/~1games~1{gameId}~1join'
  /games/{gameId}/start:
    $ref: './paths/games.yaml#/paths/~1games~1{gameId}~1start'
  /games/{gameId}/draw-vote:
    $ref: './paths/games.yaml#/paths/~1games~1{gameId}~1draw-vote'
  /games/{gameId}/players:
    $ref: './paths/games.yaml#/paths/~1games~1{gameId}~1players'

  /games/{gameId}/phases/current:
    $ref: './paths/phases.yaml#/paths/~1games~1{gameId}~1phases~1current'
  /games/{gameId}/phases/current/orders:
    $ref: './paths/phases.yaml#/paths/~1games~1{gameId}~1phases~1current~1orders'
  /games/{gameId}/phases/current/ready:
    $ref: './paths/phases.yaml#/paths/~1games~1{gameId}~1phases~1current~1ready'
  /games/{gameId}/phases/current/skip-grace:
    $ref: './paths/phases.yaml#/paths/~1games~1{gameId}~1phases~1current~1skip-grace'

  /games/{gameId}/messages:
    $ref: './paths/messages.yaml#/paths/~1games~1{gameId}~1messages'
  /games/{gameId}/messages/dm/{participantId}:
    $ref: './paths/messages.yaml#/paths/~1games~1{gameId}~1messages~1dm~1{participantId}'
