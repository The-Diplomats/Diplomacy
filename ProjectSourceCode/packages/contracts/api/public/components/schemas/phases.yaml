Unit:
  type: object
  additionalProperties: false
  properties:
    type:
      $ref: '#/UnitType'
    owner:
      $ref: './common.yaml#/Power'
    location:
      $ref: '#/MapLocation'
  required:
    - type
    - owner
    - location

DislodgedUnit:
  type: object
  additionalProperties: false
  properties:
    unit:
      $ref: '#/Unit'
    attackerFrom:
      description: Null when the attacker arrived by convoy.
      oneOf:
        - $ref: '#/ProvinceCode'
        - type: 'null'
  required:
    - unit
    - attackerFrom

BoardState:
  type: object
  additionalProperties: false
  properties:
    year:
      type: integer
      minimum: 1901
    season:
      $ref: '#/Season'
    phaseType:
      $ref: '#/PhaseType'
    units:
      type: array
      items:
        $ref: '#/Unit'
    supplyCenters:
      type: object
      propertyNames:
        $ref: '#/ProvinceCode'
      additionalProperties:
        $ref: './common.yaml#/Power'
    dislodged:
      type: array
      description: Units awaiting a retreat order; empty outside retreat phases.
      items:
        $ref: '#/DislodgedUnit'
    standoffs:
      type: array
      description: Provinces left empty by a standoff; no unit may retreat there.
      items:
        $ref: '#/ProvinceCode'
  required:
    - year
    - season
    - phaseType
    - units
    - supplyCenters
    - dislodged
    - standoffs

Phase:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    gameId:
      type: string
      format: uuid
    phaseType:
      $ref: '#/PhaseType'
    deadlineAt:
      type: string
      format: date-time
    resolvedAt:
      oneOf:
        - type: string
          format: date-time
        - type: 'null'
    boardState:
      $ref: '#/BoardState'
    readiness:
      $ref: '#/ReadinessStatus'
  required:
    - id
    - gameId
    - phaseType
    - deadlineAt
    - resolvedAt
    - boardState
    - readiness

OrderResult:
  type: string
  enum:
    - success
    - bounced
    - cut
    - void
    - disbanded

HoldOrder:
  type: object
  additionalProperties: false
  description: The unit stays where it is.
  properties:
    action:
      type: string
      enum:
        - hold
    unit:
      $ref: '#/MapLocation'
  required:
    - action
    - unit

MoveOrder:
  type: object
  additionalProperties: false
  description: The unit moves to an adjacent location, or by convoy when `viaConvoy` is set.
  properties:
    action:
      type: string
      enum:
        - move
    unit:
      $ref: '#/MapLocation'
    to:
      $ref: '#/MapLocation'
    viaConvoy:
      type: boolean
  required:
    - action
    - unit
    - to

SupportOrder:
  type: object
  additionalProperties: false
  description: Supports the unit in `supported` moving to `to`, or holding when `to` is omitted.
  properties:
    action:
      type: string
      enum:
        - support
    unit:
      $ref: '#/MapLocation'
    supported:
      $ref: '#/ProvinceCode'
    to:
      $ref: '#/ProvinceCode'
  required:
    - action
    - unit
    - supported

ConvoyOrder:
  type: object
  additionalProperties: false
  description: A fleet carries the army in `army` toward `to`.
  properties:
    action:
      type: string
      enum:
        - convoy
    unit:
      $ref: '#/MapLocation'
    army:
      $ref: '#/ProvinceCode'
    to:
      $ref: '#/ProvinceCode'
  required:
    - action
    - unit
    - army
    - to

RetreatOrder:
  type: object
  additionalProperties: false
  description: A dislodged unit retreats to `to`.
  properties:
    action:
      type: string
      enum:
        - retreat
    unit:
      $ref: '#/MapLocation'
    to:
      $ref: '#/MapLocation'
  required:
    - action
    - unit
    - to

DisbandOrder:
  type: object
  additionalProperties: false
  description: Removes the unit, in a retreat or build phase.
  properties:
    action:
      type: string
      enum:
        - disband
    unit:
      $ref: '#/MapLocation'
  required:
    - action
    - unit

BuildOrder:
  type: object
  additionalProperties: false
  description: Places a new unit at `unit`, an unoccupied home supply center. Unused builds are waived.
  properties:
    action:
      type: string
      enum:
        - build
    unit:
      $ref: '#/MapLocation'
    unitType:
      $ref: '#/UnitType'
  required:
    - action
    - unit
    - unitType

OrderInput:
  oneOf:
    - $ref: '#/HoldOrder'
    - $ref: '#/MoveOrder'
    - $ref: '#/SupportOrder'
    - $ref: '#/ConvoyOrder'
    - $ref: '#/RetreatOrder'
    - $ref: '#/DisbandOrder'
    - $ref: '#/BuildOrder'
  discriminator:
    propertyName: action
    mapping:
      hold: '#/HoldOrder'
      move: '#/MoveOrder'
      support: '#/SupportOrder'
      convoy: '#/ConvoyOrder'
      retreat: '#/RetreatOrder'
      disband: '#/DisbandOrder'
      build: '#/BuildOrder'

Order:
  type: object
  additionalProperties: false
  properties:
    id:
      type: string
      format: uuid
    order:
      $ref: '#/OrderInput'
    result:
      description: Null until the phase is adjudicated.
      oneOf:
        - $ref: '#/OrderResult'
        - type: 'null'
  required:
    - id
    - order
    - result

SubmitOrdersRequest:
  type: object
  additionalProperties: false
  properties:
    orders:
      type: array
      items:
        $ref: '#/OrderInput'
  required:
    - orders

ReadinessStatus:
  type: object
  additionalProperties: false
  properties:
    affected:
      type: boolean
      description:
        Whether the requesting player must act this phase (has units in movement, a dislodged unit in
        retreat, or a build/disband in build). Always false for eliminated players.
    ready:
      type: boolean
    readyCount:
      type: integer
      minimum: 0
    affectedCount:
      type: integer
      minimum: 0
    graceActive:
      type: boolean
    skipGraceVotes:
      type: integer
      minimum: 0
  required:
    - affected
    - ready
    - readyCount
    - affectedCount
    - graceActive
    - skipGraceVotes
