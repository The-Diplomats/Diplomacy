openapi: 3.1.0
# API metadata shown in documentation and generated clients.
info:
  title: Diplomacy API
  version: 0.0.0
  description:
    Internal API contract for the Diplomacy monorepo. New game-related payloads are proposed for team
    review.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
# Base URL is relative to wherever the backend mounts this API.
servers:
  - url: /
    description: Mount-relative base path
# Endpoint groups used to organize generated API documentation.
tags:
  - name: Health
    description: Service health
  - name: Auth
    description: Authentication
  - name: Games
    description: Game creation and management
  - name: Phases
    description: Phase status and resolution
  - name: Orders
    description: Order submission and retrieval
  - name: Ready
    description: Player readiness and grace handling
  - name: Messages
    description: Game chat
# HTTP endpoints. Each path contains one or more methods (GET, POST, etc.).
# operationId must be unique; $ref points to reusable schemas defined below.
paths:
  # Liveness probe for monitoring. HEAD has no body; GET returns uptime and status.
  /health:
    head:
      operationId: headHealth
      tags:
        - Health
      summary: Health check (headers only, for uptime monitors)
      responses:
        '200':
          description: Service is healthy
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  # Returns the active session user; callers without a session receive 401.
  /auth/me:
    get:
      operationId: getAuthMe
      tags:
        - Auth
      summary: Current authenticated user
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # Email/password login; a successful response establishes a session.
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [Auth]
      summary: Log in with email-or-username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Email not yet verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # Begin registration: creates an unverified user and emails a code. Always 202 (enumeration-safe).
  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [Auth]
      summary: Begin account registration (verification email sent)
      description: >
        Creates the user in an unverified state and emails a verification code.
        Response is intentionally generic to prevent email enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Verification email sent (or would have been; response is enumeration-safe)
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/register/verify:
    post:
      operationId: postAuthRegisterVerify
      tags: [Auth]
      summary: Complete registration with the emailed verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterVerifyRequest'
      responses:
        '200':
          description: Verified and logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/register/resend:
    post:
      operationId: postAuthRegisterResend
      tags: [Auth]
      summary: Resend the email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterResendRequest'
      responses:
        '202':
          description: Fresh verification email sent (enumeration-safe)
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/password-reset:
    post:
      operationId: postAuthPasswordReset
      tags: [Auth]
      summary: Request a password reset code via email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Reset email sent (enumeration-safe)
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/password-reset/verify:
    post:
      operationId: postAuthPasswordResetVerify
      tags: [Auth]
      summary: Complete password reset with the emailed code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequest'
      responses:
        '200':
          description: Password updated, logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # Terminate the current session. HTTP 204 intentionally has no response body.
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags:
        - Auth
      summary: End the current session
      responses:
        '204':
          description: Signed out
  # Start Microsoft OpenID Connect authentication and obtain the authorization URL.
  /auth/oauth/microsoft/login:
    post:
      operationId: postMicrosoftOAuthLogin
      tags:
        - Auth
      summary: Initiate Microsoft OpenID Connect login
      responses:
        '200':
          description: Authorization URL created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthLoginResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      description:
        Returns a Microsoft authorization URL and persists OIDC state, nonce and PKCE verifier in the
        pre-auth session.
  # Finish the Microsoft OAuth flow using the returned code/state.
  /auth/oauth/microsoft/callback:
    get:
      operationId: getMicrosoftOAuthCallback
      tags:
        - Auth
      summary: Complete Microsoft OIDC login
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Session created; redirect to frontend
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      description:
        Exchanges authorization code and establishes session. On success redirects to the frontend. An
        OAuth error may be returned as query parameters.
  # List lobby games (GET) or create a new game (POST).
  /games:
    get:
      operationId: getGames
      tags:
        - Games
      summary: List games in the lobby
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameList'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      operationId: postGames
      tags:
        - Games
      summary: Create a new game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Game created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # Look up a single game by its ID. {id} is a URL path parameter.
  /games/{id}:
    get:
      operationId: getGameById
      tags:
        - Games
      summary: Get game details
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # Join the game using an invitation code or open slot, as permitted.
  /games/{id}/join:
    post:
      operationId: postGameJoin
      tags:
        - Games
      summary: Join forming game by invite code or open slot
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinGameRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # Host starts a game after all prerequisites are satisfied.
  /games/{id}/start:
    post:
      operationId: postGameStart
      tags:
        - Games
      summary: Creator starts game; fill remaining seats with AI
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameDetail'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # POST casts/toggles a draw vote; DELETE removes the vote.
  /games/{id}/draw-vote:
    post:
      operationId: postGameDrawVote
      tags:
        - Games
      summary: Cast or toggle DIAS draw vote
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrawVoteStatus'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteGameDrawVote
      tags:
        - Games
      summary: Remove own draw vote
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '204':
          description: Draw vote removed
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # Get the game's current phase and progress.
  /games/{id}/phases/current:
    get:
      operationId: getCurrentPhase
      tags:
        - Phases
      summary: Get current phase and board state
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Phase'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # GET reads player orders; PUT submits or replaces the current orders.
  /games/{id}/phases/current/orders:
    get:
      operationId: getCurrentOrders
      tags:
        - Orders
      summary: List authenticated player orders for current phase
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      operationId: putCurrentOrders
      tags:
        - Orders
      summary: Replace or update own current-phase orders
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrdersRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # POST marks ready; DELETE clears readiness.
  /games/{id}/phases/current/ready:
    post:
      operationId: postCurrentReady
      tags:
        - Ready
      summary: Mark player ready
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteCurrentReady
      tags:
        - Ready
      summary: Un-ready player; cancel grace if necessary
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  # Skip the current grace period according to game rules.
  /games/{id}/phases/current/skip-grace:
    post:
      operationId: postCurrentSkipGrace
      tags:
        - Ready
      summary: Vote to skip 30-second grace period
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /games/{gameId}/messages:
    post:
      operationId: postGameMessage
      tags: [Messages]
      summary: Send a chat message in a game
      description: Sender is determined by which user is logged in, not sent in the request (to prevent impersonation)
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Message saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Logged-in user is not in this game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

# Reusable definitions referenced above with #/components/schemas/<Name>.
components:
  # Shared request parameters, referenced with $ref: '#/components/parameters/<Name>'.
  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: Game ID
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
  # A schema defines the shape and validation rules of a JSON value.
  # required: lists mandatory fields; additionalProperties: false rejects unknown fields.
  # Schema names and payload details should be reviewed against backend implementations.
  schemas:
    # Result of the GET /health uptime check.
    HealthStatus:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - down
        uptime:
          type: integer
          minimum: 0
          description: Server uptime in seconds
      required:
        - status
        - uptime
    # Public representation of an authenticated account.
    User:
      type: object
      required: [id, email, username]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string

    LoginRequest:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: Email address or username
          minLength: 1
        password:
          type: string
          minLength: 1

    RegisterRequest:
      type: object
      required: [email, username, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          pattern: '^[a-zA-Z0-9_]{3,20}$'
          description: 3-20 chars, alphanumeric or underscore
        password:
          type: string
          minLength: 8

    RegisterVerifyRequest:
      type: object
      required: [identifier, code]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: Email address or username
        code:
          type: string
          pattern: '^[0-9]{6}$'

    RegisterResendRequest:
      type: object
      required: [identifier]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: Email address or username

    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email

    PasswordResetVerifyRequest:
      type: object
      required: [email, code, newPassword]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[0-9]{6}$'
        newPassword:
          type: string
          minLength: 8

    ProblemDetails:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        detail:
          type: string
        status:
          type: integer
      required:
        - title
    # Microsoft login authorization details returned to the client.
    OAuthLoginResponse:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Microsoft OIDC authorization URL
      required:
        - url
    # Allowed lifecycle states of a game.
    GameStatus:
      type: string
      enum:
        - forming
        - active
        - finished
        - abandoned
    # Allowed Diplomacy powers / countries.
    Power:
      type: string
      enum:
        - Austria
        - England
        - France
        - Germany
        - Italy
        - Russia
        - Turkey
    # Summary information about one game, suitable for a lobby listing.
    Game:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/GameStatus'
        creator_id:
          type: string
          format: uuid
        player_count:
          type: integer
          minimum: 0
          maximum: 7
        max_players:
          type: integer
          enum:
            - 7
        movement_deadline_seconds:
          type: integer
          minimum: 60
          default: 86400
        created_at:
          type: string
          format: date-time
        invite_code:
          type: string
      required:
        - id
        - name
        - status
        - creator_id
        - player_count
        - max_players
        - movement_deadline_seconds
        - created_at
    # Response shape for the list of lobby games.
    GameList:
      type: object
      additionalProperties: false
      properties:
        games:
          type: array
          items:
            $ref: '#/components/schemas/Game'
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
      required:
        - games
        - next_cursor
    # Player membership and assigned power within a game.
    GamePlayer:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        user_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        power:
          oneOf:
            - $ref: '#/components/schemas/Power'
            - type: 'null'
        is_ai:
          type: boolean
        afk_counter:
          type: integer
          minimum: 0
        locked:
          type: boolean
      required:
        - id
        - user_id
        - power
        - is_ai
        - afk_counter
        - locked
    # More complete game information than a lobby summary.
    GameDetail:
      type: object
      additionalProperties: false
      properties:
        game:
          $ref: '#/components/schemas/Game'
        players:
          type: array
          items:
            $ref: '#/components/schemas/GamePlayer'
      required:
        - game
        - players
    # Input fields for creating a new game.
    CreateGameRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        private:
          type: boolean
        movement_deadline_seconds:
          type: integer
          minimum: 60
          default: 86400
      required:
        - name
    # Data used to request membership in an existing game.
    JoinGameRequest:
      type: object
      additionalProperties: false
      properties:
        invite_code:
          type: string
          description: Optional for open games; required for invite-only games
    # Current state or outcome of a proposed draw.
    DrawVoteStatus:
      type: object
      additionalProperties: false
      properties:
        voted:
          type: boolean
        votes:
          type: integer
          minimum: 0
        eligible_voters:
          type: integer
          minimum: 0
        unanimous:
          type: boolean
      required:
        - voted
        - votes
        - eligible_voters
        - unanimous
    # Kinds of phases in a Diplomacy turn.
    PhaseType:
      type: string
      enum:
        - movement
        - retreat
        - build
    # Current phase metadata, timing and state.
    Phase:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        game_id:
          type: string
          format: uuid
        phase_type:
          $ref: '#/components/schemas/PhaseType'
        deadline_at:
          type: string
          format: date-time
        resolved_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        board_state:
          type: object
          additionalProperties: true
          description: Serialized board snapshot; exact schema must be aligned with game-types
        readiness:
          $ref: '#/components/schemas/ReadinessStatus'
      required:
        - id
        - game_id
        - phase_type
        - deadline_at
        - resolved_at
        - board_state
        - readiness
    # Kinds of Diplomacy orders a unit can be given.
    OrderType:
      type: string
      enum:
        - hold
        - move
        - support
        - convoy
        - retreat
        - build
        - disband
        - waive
    # One planned Diplomacy move or action, as returned by the server.
    Order:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        unit_id:
          type: string
        type:
          $ref: '#/components/schemas/OrderType'
        from:
          type: string
        to:
          type: string
        target_unit_id:
          type: string
        result:
          type: string
      required:
        - id
        - type
    # One order as submitted by a player. Server-set fields (id, result) are excluded.
    OrderInput:
      type: object
      additionalProperties: false
      properties:
        unit_id:
          type: string
        type:
          $ref: '#/components/schemas/OrderType'
        from:
          type: string
        to:
          type: string
        target_unit_id:
          type: string
      required:
        - type
    # Payload that submits or updates player orders.
    SubmitOrdersRequest:
      type: object
      additionalProperties: false
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderInput'
      required:
        - orders
    # Who has marked ready and associated readiness state.
    ReadinessStatus:
      type: object
      additionalProperties: false
      properties:
        affected:
          type: boolean
          description:
            Whether the requesting player must act this phase (has units in movement, a dislodged unit in
            retreat, or a build/disband in build). Always false for eliminated players.
        ready:
          type: boolean
        ready_count:
          type: integer
          minimum: 0
        affected_count:
          type: integer
          minimum: 0
        grace_active:
          type: boolean
        skip_grace_votes:
          type: integer
          minimum: 0
      required:
        - affected
        - ready
        - ready_count
        - affected_count
        - grace_active
        - skip_grace_votes

    SendMessageRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000

    Message:
      type: object
      required: [id, gameId, fromPlayerId, toPlayerId, text, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        fromPlayerId:
          type: string
          format: uuid
        toPlayerId:
          type: [string, 'null']
          format: uuid
          description: Null means public message
        text:
          type: string
        createdAt:
          type: string
          format: date-time
