<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html,
      body {
        background: #000;
      }
    </style>

    <title>Diplomacy</title>
    <meta
      name="description"
      content="Diplomacy Online: web-based implementation of the classic 1950s strategy game of alliances and betrayal."
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon/light/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon/dark/favicon.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/favicon/light/favicon-96x96.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/favicon/dark/favicon-96x96.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="shortcut icon"
      href="/favicon/light/favicon.ico"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="shortcut icon"
      href="/favicon/dark/favicon.ico"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/light/apple-touch-icon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/dark/apple-touch-icon.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, Discord link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Diplomacy Online" />
    <meta
      property="og:description"
      content="Web-based implementation of the classic 1950s strategy game of alliances and betrayal."
    />
    <meta property="og:url" content="https://diplomacy.gg" />
    <meta property="og:image" content="https://diplomacy.gg/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Diplomacy Online" />
    <meta
      name="twitter:description"
      content="Web-based implementation of the classic 1950s strategy game of alliances and betrayal."
    />
    <meta name="twitter:image" content="https://diplomacy.gg/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
