name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / Tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['ProjectSourceCode--release_created'] }}
      tag_name: ${{ steps.release.outputs['ProjectSourceCode--tag_name'] }}
      version: ${{ steps.release.outputs['ProjectSourceCode--version'] }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  release-notes-file:
    name: Open release notes PR
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Compose release notes markdown
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          BODY=$(gh release view "$TAG" --json body --jq .body)
          DIR="MilestoneSubmissions/release-notes"
          FILE="$DIR/$TAG.md"
          mkdir -p "$DIR"
          {
            printf 'Release: Diplomacy %s\n\n' "$VERSION"
            printf 'Tag: %s\n\n' "$TAG"
            printf '%s\n' "$BODY"
          } > "$FILE"

      - name: Commit on a branch and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          BRANCH="release-notes/${TAG}"

          # Look up any open in-repo PR on this branch (base-agnostic, fork-excluded).
          PR_JSON=$(gh pr list \
            --head "$BRANCH" \
            --state open \
            --json number,headRepositoryOwner,baseRefName \
            --jq ".[] | select(.headRepositoryOwner.login == \"${REPO_OWNER}\")" \
            | jq -s '.[0] // empty')

          if [[ -n "$PR_JSON" ]]; then
            PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
            PR_BASE=$(echo "$PR_JSON" | jq -r '.baseRefName')
            if [[ "$PR_BASE" == "main" ]]; then
              echo "PR #${PR_NUMBER} already open for ${BRANCH} targeting main; nothing to do."
              exit 0
            fi
            # Retargeted PR: don't delete the branch and lose its commits. Surface loudly.
            echo "::error::PR #${PR_NUMBER} on ${BRANCH} targets '${PR_BASE}', not main. Refusing to replace the branch; resolve manually."
            exit 1
          fi

          # No PR anywhere. Delete stale branch from a prior failed run (push ok, PR-create failed).
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Deleting orphaned remote branch ${BRANCH}"
            git push origin --delete "$BRANCH"
          fi

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "MilestoneSubmissions/release-notes/${TAG}.md"
          git commit -m "docs(release-notes): add ${TAG} notes"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs(release-notes): add ${TAG} notes" \
            --body "Automated release-notes file for \`${TAG}\`. Generated from the GitHub Release body." \
            --label "documentation"
