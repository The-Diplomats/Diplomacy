name: E2E

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ProjectSourceCode
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diplomacy
          POSTGRES_PASSWORD: diplomacy
          POSTGRES_DB: diplomacy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diplomacy -d diplomacy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://diplomacy:diplomacy@localhost:5432/diplomacy
      REDIS_URL: redis://localhost:6379
      # Throwaway database, so the seeded user's password is not a secret.
      E2E_USER_PASSWORD: ci-e2e-password-not-a-secret
      E2E_PASSWORD: ci-e2e-password-not-a-secret
      E2E_BASE_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v7

      # Always run so the required check reports; gate real work by path changes.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'ProjectSourceCode/apps/**'
              - 'ProjectSourceCode/packages/**'
              - 'ProjectSourceCode/package.json'
              - 'ProjectSourceCode/pnpm-lock.yaml'
              - 'ProjectSourceCode/pnpm-workspace.yaml'
              - 'ProjectSourceCode/tsconfig*.json'
              - '.github/workflows/e2e.yml'

      - if: steps.filter.outputs.app != 'true'
        run: echo "No app changes; skipping E2E."

      - uses: pnpm/action-setup@v6
        if: steps.filter.outputs.app == 'true'
        with:
          package_json_file: ProjectSourceCode/package.json
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.app == 'true'
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: ProjectSourceCode/pnpm-lock.yaml
      - if: steps.filter.outputs.app == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        if: steps.filter.outputs.app == 'true'
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      - if: steps.filter.outputs.app == 'true'
        run: pnpm --filter "backend..." --filter "frontend..." build
      - if: steps.filter.outputs.app == 'true'
        run: pnpm --filter @diplomacy/db migrate
      - if: steps.filter.outputs.app == 'true'
        run: pnpm --filter backend seed:scenario e2e-auth

      # The built SPA calls /api, which vite preview proxies to the backend as in local dev.
      - name: Start backend
        if: steps.filter.outputs.app == 'true'
        working-directory: ProjectSourceCode/apps/backend
        env:
          NODE_ENV: development
          PORT: "3001"
          SESSION_SECRET: ci-dummy-secret-must-be-at-least-32-chars-long
          FRONTEND_ORIGINS: http://localhost:4173
          APP_URL: http://localhost:4173
          EMAIL_FROM: no-reply@diplomacy.gg
        run: node dist/index.js > "$RUNNER_TEMP/backend.log" 2>&1 &
      - name: Start frontend
        if: steps.filter.outputs.app == 'true'
        working-directory: ProjectSourceCode/apps/frontend
        run: pnpm exec vite preview --port 4173 --strictPort > "$RUNNER_TEMP/frontend.log" 2>&1 &
      - name: Wait for the stack
        if: steps.filter.outputs.app == 'true'
        run: |
          for url in http://localhost:3001/health http://localhost:4173/api/health; do
            timeout 60 bash -c "until curl -sf $url > /dev/null; do sleep 1; done"
          done

      - if: steps.filter.outputs.app == 'true'
        run: pnpm --filter frontend e2e

      - uses: actions/upload-artifact@v7
        if: failure() && steps.filter.outputs.app == 'true'
        with:
          name: e2e-report
          path: |
            ProjectSourceCode/apps/frontend/playwright-report/
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          retention-days: 7
