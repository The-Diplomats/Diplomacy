openapi: 3.1.0

info:
  title: Diplomacy API
  version: 0.0.0
  description: Internal API contract for the Diplomacy monorepo.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later

servers:
  - url: /
    description: Mount-relative base path

tags:
  - name: Health
    description: Service health
  - name: Auth
    description: Authentication

paths:
  /health:
    head:
      operationId: headHealth
      tags: [Health]
      summary: Health check (headers only, for uptime monitors)
      responses:
        '200':
          description: Service is healthy
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [Auth]
      summary: Current authenticated user
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [Auth]
      summary: Log in with email-or-username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Email not yet verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [Auth]
      summary: Begin account registration (verification email sent)
      description: >
        Creates the user in an unverified state and emails a verification code.
        Response is intentionally generic to prevent email enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Verification email sent (or would have been; response is enumeration-safe)
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/register/verify:
    post:
      operationId: postAuthRegisterVerify
      tags: [Auth]
      summary: Complete registration with the emailed verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterVerifyRequest'
      responses:
        '200':
          description: Verified and logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/register/resend:
    post:
      operationId: postAuthRegisterResend
      tags: [Auth]
      summary: Resend the email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterResendRequest'
      responses:
        '202':
          description: Fresh verification email sent (enumeration-safe)
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/password-reset:
    post:
      operationId: postAuthPasswordReset
      tags: [Auth]
      summary: Request a password reset code via email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Reset email sent (enumeration-safe)
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/password-reset/verify:
    post:
      operationId: postAuthPasswordResetVerify
      tags: [Auth]
      summary: Complete password reset with the emailed code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequest'
      responses:
        '200':
          description: Password updated, logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [Auth]
      summary: End the current session
      responses:
        '204':
          description: Signed out

components:
  schemas:
    HealthStatus:
      type: object
      required: [status, uptime]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        uptime:
          type: integer
          minimum: 0
          description: Server uptime in seconds

    User:
      type: object
      required: [id, email, username]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string

    LoginRequest:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: Email address or username
          minLength: 1
        password:
          type: string
          minLength: 1

    RegisterRequest:
      type: object
      required: [email, username, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          pattern: '^[a-zA-Z0-9_]{3,20}$'
          description: 3-20 chars, alphanumeric or underscore
        password:
          type: string
          minLength: 8

    RegisterVerifyRequest:
      type: object
      required: [identifier, code]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: Email address or username
        code:
          type: string
          pattern: '^[0-9]{6}$'

    RegisterResendRequest:
      type: object
      required: [identifier]
      additionalProperties: false
      properties:
        identifier:
          type: string
          description: Email address or username

    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email

    PasswordResetVerifyRequest:
      type: object
      required: [email, code, newPassword]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[0-9]{6}$'
        newPassword:
          type: string
          minLength: 8

    ProblemDetails:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
        detail:
          type: string
        status:
          type: integer
