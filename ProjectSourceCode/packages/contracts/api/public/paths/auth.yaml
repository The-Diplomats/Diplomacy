paths:
  /auth/me:
    get:
      operationId: getAuthMe
      tags:
        - Auth
      summary: Current authenticated user
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: ../components/schemas/auth.yaml#/User
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails

  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [Auth]
      summary: Log in with email-or-username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/LoginRequest
      responses:
        '200':
          description: Logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: ../components/schemas/auth.yaml#/User
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails
        '401':
          description: Invalid credentials (unknown identifier or wrong password)
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails
        '403':
          description: Credentials are valid but the email is not yet verified
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails
        '429':
          $ref: ../components/responses/common.yaml#/RateLimited

  /auth/register:
    post:
      operationId: postAuthRegister
      tags: [Auth]
      summary: Begin account registration (verification email sent)
      description: >
        Creates the user in an unverified state and emails a verification code.
        Response is intentionally generic to prevent email enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/RegisterRequest
      responses:
        '202':
          description: Verification email sent (or would have been; response is enumeration-safe)
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails
        '403':
          description:
            Sign-up is invite-only and the email isn't on the allowlist. Decided before any account
            lookup, so it never reveals whether an account exists.
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails
        '429':
          $ref: ../components/responses/common.yaml#/RateLimited

  /auth/register/verify:
    post:
      operationId: postAuthRegisterVerify
      tags: [Auth]
      summary: Complete registration with the emailed verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/RegisterVerifyRequest
      responses:
        '200':
          description: Verified and logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: ../components/schemas/auth.yaml#/User
        '400':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails
        '429':
          $ref: ../components/responses/common.yaml#/RateLimited

  /auth/register/resend:
    post:
      operationId: postAuthRegisterResend
      tags: [Auth]
      summary: Resend the email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/RegisterResendRequest
      responses:
        '202':
          description: Fresh verification email sent (enumeration-safe)
        '429':
          $ref: ../components/responses/common.yaml#/RateLimited

  /auth/password-reset:
    post:
      operationId: postAuthPasswordReset
      tags: [Auth]
      summary: Request a password reset code via email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/PasswordResetRequest
      responses:
        '202':
          description: Reset email sent (enumeration-safe)
        '429':
          $ref: ../components/responses/common.yaml#/RateLimited

  /auth/password-reset/verify:
    post:
      operationId: postAuthPasswordResetVerify
      tags: [Auth]
      summary: Complete password reset with the emailed code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/PasswordResetVerifyRequest
      responses:
        '200':
          description: Password updated, logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: ../components/schemas/auth.yaml#/User
        '400':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails
        '429':
          $ref: ../components/responses/common.yaml#/RateLimited

  /auth/logout:
    post:
      operationId: postAuthLogout
      tags:
        - Auth
      summary: End the current session
      responses:
        '204':
          description: Signed out
        '429':
          $ref: ../components/responses/common.yaml#/RateLimited

  /auth/oauth/microsoft/login:
    post:
      operationId: postMicrosoftOAuthLogin
      tags:
        - Auth
      summary: Initiate Microsoft OpenID Connect login
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/OAuthLoginRequest
      responses:
        '200':
          description: Authorization URL created
          content:
            application/json:
              schema:
                $ref: ../components/schemas/auth.yaml#/OAuthLoginResponse
        '404':
          description: Provider not configured on this server
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails
        '429':
          $ref: ../components/responses/common.yaml#/RateLimited
      description:
        Returns a Microsoft authorization URL and persists OIDC state, nonce and PKCE verifier in the
        pre-auth session.

  /auth/oauth/microsoft/callback:
    get:
      operationId: getMicrosoftOAuthCallback
      tags:
        - Auth
      summary: Complete Microsoft OIDC login
      x-eov-allow-unknown-query-parameters: true
      parameters:
        - name: code
          in: query
          required: false
          description:
            Present on success. Absent when the provider redirects with `error` (RFC 6749 §4.1.2.1); the
            handler must reject a missing code when no error is present.
          # Providers send codes with unencoded reserved characters (Google `4/0A...`,
          # Microsoft `M.C5..._BAY...!...`); RFC 3986 allows them in a query string.
          allowReserved: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          description:
            Optional here so a missing or forged state still reaches the handler, which rejects it
            with the frontend error redirect instead of a JSON 400.
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description:
            Redirect to the frontend. On success a session cookie is set and the user is sent to the
            post-login landing page. On any failure (state mismatch, expired code, error query
            params, rate limit, invite-only sign-up) the user is redirected to the login page with an `oauthError`
            reason; the response body is empty in both cases.
      description:
        Exchanges authorization code and establishes session. On success redirects to the frontend. An
        OAuth error may be returned as query parameters.

  /auth/oauth/google/login:
    post:
      operationId: postGoogleOAuthLogin
      tags:
        - Auth
      summary: Initiate Google OpenID Connect login
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/OAuthLoginRequest
      responses:
        '200':
          description: Authorization URL created
          content:
            application/json:
              schema:
                $ref: ../components/schemas/auth.yaml#/OAuthLoginResponse
        '404':
          description: Provider not configured on this server
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails
        '429':
          $ref: ../components/responses/common.yaml#/RateLimited
      description:
        Returns a Google authorization URL and persists OIDC state, nonce and PKCE verifier in the
        pre-auth session.

  /auth/oauth/google/callback:
    get:
      operationId: getGoogleOAuthCallback
      tags:
        - Auth
      summary: Complete Google OIDC login
      x-eov-allow-unknown-query-parameters: true
      parameters:
        - name: code
          in: query
          required: false
          description:
            Present on success. Absent when the provider redirects with `error` (RFC 6749 §4.1.2.1); the
            handler must reject a missing code when no error is present.
          # Providers send codes with unencoded reserved characters (Google `4/0A...`,
          # Microsoft `M.C5..._BAY...!...`); RFC 3986 allows them in a query string.
          allowReserved: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          description:
            Optional here so a missing or forged state still reaches the handler, which rejects it
            with the frontend error redirect instead of a JSON 400.
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description:
            Redirect to the frontend. On success a session cookie is set and the user is sent to the
            post-login landing page. On any failure (state mismatch, expired code, error query
            params, rate limit, invite-only sign-up) the user is redirected to the login page with an `oauthError`
            reason; the response body is empty in both cases.
      description:
        Exchanges authorization code and establishes session. On success redirects to the frontend. An
        OAuth error may be returned as query parameters.

  /auth/oauth/providers:
    get:
      operationId: getAuthOAuthProviders
      tags: [Auth]
      summary: List the OAuth providers configured on this server
      responses:
        '200':
          description: Enabled providers (empty when none are configured)
          content:
            application/json:
              schema:
                $ref: ../components/schemas/auth.yaml#/OAuthProviderList

  /auth/oauth/pending:
    get:
      operationId: getAuthOAuthPending
      tags: [Auth]
      summary: Pending OAuth sign-up awaiting a username
      responses:
        '200':
          description: A provider identity is verified and waiting for a username
          content:
            application/json:
              schema:
                $ref: ../components/schemas/auth.yaml#/OAuthPendingSignup
        '404':
          description: No pending sign-up on this session (or it expired)
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails

  /auth/oauth/complete:
    post:
      operationId: postAuthOAuthComplete
      tags: [Auth]
      summary: Finish an OAuth sign-up by choosing a username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/auth.yaml#/OAuthCompleteRequest
      responses:
        '200':
          description: Account created, logged in (session cookie set)
          content:
            application/json:
              schema:
                $ref: ../components/schemas/auth.yaml#/User
        '404':
          description: No pending sign-up on this session (or it expired)
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails
        '409':
          description: Username taken, or the email was registered in the meantime
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/ProblemDetails
        '429':
          $ref: ../components/responses/common.yaml#/RateLimited
