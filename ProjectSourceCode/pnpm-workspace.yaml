allowBuilds:
  es5-ext: false
  esbuild: true

autoInstallPeers: true

catalog:
  '@commitlint/cli': ^21.2.4
  '@commitlint/config-conventional': ^21.2.4
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  '@eslint/js': ^10.0.1
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react: ^7.37.5
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-simple-import-sort: ^14.0.0
  express: ^5.3.0
  globals: ^17.13.0
  helmet: ^8.3.0
  '@kubb/cli': 4.38.0
  '@kubb/core': 4.38.0
  '@kubb/plugin-client': 4.38.0
  '@kubb/plugin-oas': 4.38.0
  '@kubb/plugin-react-query': 4.38.0
  '@kubb/plugin-ts': 4.38.0
  lint-staged: ^17.6.0
  pg: ^8.23.1
  pino: ^10.4.0
  pino-http: ^11.0.0
  pino-pretty: ^13.2.0
  prettier: ^3.9.10
  '@redocly/cli': ^2.72.1
  supertest: ^7.3.1
  '@tanstack/react-query': ^5.105.0
  tsx: ^4.23.15
  '@types/express': ^5.0.6
  '@types/node': ^24.19.2
  '@types/pg': ^8.23.1
  '@types/supertest': ^7.2.1
  typescript: ~5.8.3
  typescript-eslint: ^8.72.1
  vitest: 5.0.5

minimumReleaseAge: 1440 # 24h
minimumReleaseAgeExclude:
  - '@redocly/cli@2.72.1'

packages:
  - apps/*
  - packages/*

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-react>eslint': '>=10.0.0'

saveWorkspaceProtocol: rolling
