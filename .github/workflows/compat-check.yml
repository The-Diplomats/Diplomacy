name: OpenAPI Compat

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled, unlabeled]
    paths:
      - "ProjectSourceCode/packages/contracts/api/**"
      - ".github/workflows/compat-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  compat:
    name: Breaking change check
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install oasdiff
        run: |
          curl -L https://github.com/oasdiff/oasdiff/releases/latest/download/oasdiff_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin oasdiff
          oasdiff --version

      - name: Extract base spec
        run: |
          git show origin/${{ github.base_ref }}:ProjectSourceCode/packages/contracts/api/public/openapi.yaml \
            > /tmp/base.yaml

      - name: Check for breaking changes
        run: |
          oasdiff breaking \
            /tmp/base.yaml \
            ProjectSourceCode/packages/contracts/api/public/openapi.yaml \
            --fail-on ERR
