name: Release

on:
  workflow_run:
    workflows: ["Deploy (dev)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Promote this existing release (e.g. 1.4.0) to stage and prod instead of running release-please
        type: string
        default: ""
      skip_e2e:
        description: "Break-glass: run although dev is red, and skip the stage E2E suite"
        type: boolean
        default: false
      reason:
        description: Required with skip_e2e, at least 20 characters; recorded in the run
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # A workflow_run only counts when it is this repo's own deploy-dev run and dev tested what is
  # on main now, so an older run finishing late can't release commits dev hasn't tested.
  gate:
    name: Dev gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/deploy-dev.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ inputs.version }}
          SKIP_E2E: ${{ inputs.skip_e2e }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != workflow_dispatch ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$head" != "$TESTED_SHA" ]; then
              echo "Dev tested $TESTED_SHA but main is at $head; the newer dev run will release."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run this from main; stage and prod only accept runs on main."
            exit 1
          fi
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 1.4.0"
            exit 1
          fi
          if [ "$SKIP_E2E" = true ]; then
            if [ "${#REASON}" -lt 20 ]; then
              echo "skip_e2e needs a reason of at least 20 characters"
              exit 1
            fi
            echo "::warning::E2E gates skipped by $ACTOR: $REASON"
          elif [ -z "$VERSION" ]; then
            echo "Nothing to do: release-please runs after every green dev deploy. Pass a version to promote, or skip_e2e with a reason."
            exit 1
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  release-please:
    name: Release PR / Tag
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && (github.event_name == 'workflow_run' || inputs.version == '')
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['ProjectSourceCode--release_created'] }}
      tag_name: ${{ steps.release.outputs['ProjectSourceCode--tag_name'] }}
      version: ${{ steps.release.outputs['ProjectSourceCode--version'] }}
      sha: ${{ steps.release.outputs['ProjectSourceCode--sha'] }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}

  resolve:
    name: Resolve release
    needs: [gate, release-please]
    if: >-
      !cancelled() && needs.gate.outputs.proceed == 'true' &&
      (needs.release-please.outputs.release_created == 'true' || inputs.version != '')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      images_exist: ${{ steps.images.outputs.exist }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          CREATED_VERSION: ${{ needs.release-please.outputs.version }}
          CREATED_SHA: ${{ needs.release-please.outputs.sha }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/diplomacy-v$version" --jq .sha)
          else
            version="$CREATED_VERSION"
            sha="$CREATED_SHA"
          fi
          # Anyone with write access can create a tag; only merged code may be promoted.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "$sha is not on main ($status); refusing to release it"
            exit 1
          fi
          # release-please reads main when it runs, so a Release PR merged after the gate is tagged
          # before dev has tested it.
          if [ -n "$TESTED_SHA" ]; then
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$TESTED_SHA" --jq .status)
            if [ "$status" != ahead ] && [ "$status" != identical ]; then
              echo "$version ($sha) merged after dev tested $TESTED_SHA. Once dev is green on it, run release.yml with version $version."
              exit 1
            fi
          fi
          echo "Releasing $version at $sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Reuse dev's image when the release commit was deployed on its own; otherwise (merge queue
      # batch, queued run replaced) release.yml builds that commit.
      - id: images
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          exist=true
          for app in backend worker; do
            docker buildx imagetools inspect "ghcr.io/the-diplomats/diplomacy-$app:sha-${SHA::7}" > /dev/null 2>&1 || exist=false
          done
          echo "sha-${SHA::7} images exist: $exist"
          echo "exist=$exist" >> "$GITHUB_OUTPUT"

  images:
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.images_exist != 'true' }}
    permissions:
      contents: read
      packages: write
      pull-requests: read
    uses: ./.github/workflows/container-images.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  promote:
    name: Tag release images
    needs: [resolve, images]
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          for app in backend worker; do
            image="ghcr.io/the-diplomats/diplomacy-$app"
            docker buildx imagetools create -t "$image:v$VERSION" "$image:sha-${SHA::7}"
          done

  stage:
    needs: [resolve, promote]
    if: ${{ !cancelled() && needs.promote.result == 'success' }}
    concurrency:
      group: deploy-stage
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: stage
      ref: ${{ needs.resolve.outputs.sha }}
      image_tag: v${{ needs.resolve.outputs.version }}
      e2e: ${{ inputs.skip_e2e && 'skip' || 'full' }}

  prod:
    needs: [resolve, stage]
    if: ${{ !cancelled() && needs.stage.result == 'success' }}
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      ref: ${{ needs.resolve.outputs.sha }}
      image_tag: v${{ needs.resolve.outputs.version }}
      e2e: smoke

  release-notes-file:
    name: Open release notes PR
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Compose release notes markdown
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          BODY=$(gh release view "$TAG" --json body --jq .body)
          DIR="MilestoneSubmissions/release-notes"
          FILE="$DIR/$TAG.md"
          mkdir -p "$DIR"
          {
            printf 'Release: Diplomacy %s\n\n' "$VERSION"
            printf 'Tag: %s\n\n' "$TAG"
            printf '%s\n' "$BODY"
          } > "$FILE"

      - name: Commit on a branch and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          BRANCH="release-notes/${TAG}"

          # Idempotency: if an in-repo PR for this branch targeting main is already open, we're done.
          # Server-side head=OWNER:BRANCH filter excludes forks structurally.
          EXISTING_PR=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${REPO_OWNER}:${BRANCH}&base=main" \
            --jq '.[0].number // empty')
          if [[ -n "$EXISTING_PR" ]]; then
            echo "PR #${EXISTING_PR} already open for ${BRANCH}; nothing to do."
            exit 0
          fi

          # Orphan branch from a prior failed run (push succeeded, PR-create failed): delete it.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Deleting orphaned remote branch ${BRANCH}"
            git push origin --delete "$BRANCH"
          fi

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "MilestoneSubmissions/release-notes/${TAG}.md"
          git commit -m "docs(release-notes): add ${TAG} notes"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs(release-notes): add ${TAG} notes" \
            --body "Automated release-notes file for \`${TAG}\`. Generated from the GitHub Release body." \
            --label "documentation"
